name: "Bot — gestione comandi Telegram"

on:
  repository_dispatch:
    types: [telegram-command]

permissions:
  contents: write

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa parkbot
        run: pip install -e .

      - name: Prepara secrets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/secrets"
          chmod 700 "$GITHUB_WORKSPACE/secrets"
          python3 - << 'PYEOF'
          import json, os, time
          base = os.environ["GITHUB_WORKSPACE"]
          with open(f"{base}/secrets/tokens.json", "w") as f:
              json.dump({"refresh_token": os.environ["COGNITO_REFRESH_TOKEN"], "saved_at": time.time()}, f)
          os.chmod(f"{base}/secrets/tokens.json", 0o600)
          with open(f"{base}/secrets/telegram.json", "w") as f:
              json.dump({"bot_token": os.environ["TELEGRAM_BOT_TOKEN"], "allowed_chat_id": int(os.environ["TELEGRAM_CHAT_ID"])}, f)
          os.chmod(f"{base}/secrets/telegram.json", 0o600)
          PYEOF
        env:
          COGNITO_REFRESH_TOKEN: ${{ secrets.COGNITO_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Gestisci comando
        env:
          PARKBOT_STATE_DIR: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          COMMAND: ${{ github.event.client_payload.command }}
          ARGS: ${{ github.event.client_payload.args }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          python3 - << 'EOF'
          import os, sys
          import httpx

          os.environ.setdefault("PARKBOT_STATE_DIR", os.environ["GITHUB_WORKSPACE"])
          from parkbot import config, dateparse
          from parkbot.booking import list_future_bookings, try_book_now, list_window_availability
          from parkbot.tokens import get_access_token, check_token_status, TokenError
          from parkbot import queue as q

          command = os.environ.get("COMMAND", "").lower().strip()
          args    = os.environ.get("ARGS", "").strip()
          chat_id = os.environ.get("CHAT_ID", "")
          token   = os.environ.get("TELEGRAM_BOT_TOKEN", "")

          def send(text):
              httpx.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json={"chat_id": chat_id, "text": text, "parse_mode": "HTML"},
                  timeout=10,
              )

          def send_status(prefix_lines):
              lines = list(prefix_lines)
              entries = q.list_queue()
              if entries:
                  lines.append("")
                  lines.append("📋 <b>In coda:</b>")
                  for e in entries:
                      lines.append(f"  • {dateparse.to_display(e.date)}")
              else:
                  lines.append("")
                  lines.append("📋 Nessuna altra prenotazione in coda.")
              try:
                  bundle = get_access_token()
                  bookings = list_future_bookings(token=bundle)
                  if bookings:
                      lines.append("")
                      lines.append("✅ <b>Confermate sul portale:</b>")
                      for b in bookings:
                          spot = b.get("posti_codice", "—")
                          targa = b.get("targa", "")
                          targa_str = f" · targa {targa}" if targa else ""
                          lines.append(f"  • {dateparse.to_display(b['data'])} — posto <b>{spot}</b>{targa_str}")
              except Exception:
                  pass
              send("\n".join(lines))

          if command == "/park":
              if not args:
                  send("❌ Uso: /park &lt;data&gt;\nEsempio: /park giovedì")
                  sys.exit(0)
              try:
                  iso = dateparse.parse_date(args)
              except Exception:
                  send(f"❌ Data non riconosciuta: <b>{args}</b>")
                  sys.exit(0)

              display = dateparse.to_display(iso)

              # Prova a prenotare SUBITO (il portale lo permette solo se la data è
              # già dentro la finestra prenotabile) invece di aspettare sempre la
              # coda/mezzanotte. Se non si può (fuori finestra, pieno, errore, o
              # token non disponibile) si ricade sul comportamento classico: coda.
              attempt = None
              try:
                  bundle = get_access_token()
                  attempt = try_book_now(iso, token=bundle)
              except TokenError as e:
                  print(f"WARN: token non disponibile per tentativo immediato ({e})")

              if attempt and attempt.outcome == "booked":
                  spot_line = f"\n📍 Posto: <b>{attempt.spot}</b>" if attempt.spot else ""
                  avail_line = (f"\n📊 Posti liberi rimasti: {attempt.available}/{attempt.capacity}"
                                if attempt.available is not None else "")
                  send(f"✅ Prenotato subito per <b>{display}</b>!{spot_line}{avail_line}")
                  sys.exit(0)

              if attempt and attempt.outcome == "past":
                  send(f"❌ <b>{display}</b> è una data passata, non aggiunta in coda.")
                  sys.exit(0)

              if attempt and attempt.outcome == "active_booking_conflict":
                  conflict_display = (dateparse.to_display(attempt.conflict_date)
                                      if attempt.conflict_date else "un'altra data")
                  q.queue_booking(iso, "parking", source="telegram")
                  send_status([
                      f"⏳ Hai già una prenotazione attiva per <b>{conflict_display}</b> — "
                      f"il portale ne permette una sola alla volta.\n"
                      f"<b>{display}</b> aggiunto in coda, riproverò automaticamente "
                      f"appena si libera."
                  ])
                  sys.exit(0)

              _, created = q.queue_booking(iso, "parking", source="telegram")
              reason = {
                  "waiting": "fuori dalla finestra prenotabile, ",
                  "unavailable": "nessun posto libero al momento, ",
                  "error": "errore temporaneo dal portale, ",
              }.get(attempt.outcome if attempt else None, "")
              if created:
                  send_status([f"⏳ {reason}aggiunto in coda: <b>{display}</b> — riprovo stanotte"])
              else:
                  send_status([f"ℹ️ <b>{display}</b> era già in coda."])

          elif command == "/list":
              send_status(["📋 <b>Stato prenotazioni:</b>"])

          elif command == "/cancel":
              if not args:
                  send("❌ Uso: /cancel &lt;data&gt;")
                  sys.exit(0)
              try:
                  iso = dateparse.parse_date(args)
              except Exception:
                  send(f"❌ Data non riconosciuta: <b>{args}</b>")
                  sys.exit(0)
              path = config.QUEUE_DIR / f"{iso}-parking.json"
              if path.exists():
                  path.unlink()
                  send(f"🗑️ Rimosso: <b>{dateparse.to_display(iso)}</b>")
              else:
                  send(f"ℹ️ Nessuna prenotazione in coda per {dateparse.to_display(iso)}.")

          elif command == "/future":
              try:
                  bundle = get_access_token()
                  bookings = list_future_bookings(token=bundle)
                  if not bookings:
                      send("📅 Nessuna prenotazione futura sul portale.")
                  else:
                      lines = ["📅 <b>Prenotazioni confermate:</b>"]
                      for b in bookings:
                          spot = b.get("posti_codice", "—")
                          targa = b.get("targa", "")
                          targa_str = f" · targa {targa}" if targa else ""
                          lines.append(f"  • {dateparse.to_display(b['data'])} — posto <b>{spot}</b>{targa_str}")
                      send("\n".join(lines))
              except Exception as e:
                  send(f"❌ Errore API: {e}")

          elif command in ("/spots", "/disponibilita"):
              try:
                  bundle = get_access_token()
                  rows = list_window_availability(token=bundle)
              except Exception as e:
                  send(f"❌ Errore nel controllare la disponibilità: {e}")
                  sys.exit(0)
              if not rows:
                  send("📊 Nessun giorno nella finestra prenotabile al momento.")
              else:
                  lines = ["📊 <b>Posti liberi nella finestra prenotabile:</b>"]
                  for row in rows:
                      d_display = dateparse.to_display(row["date"])
                      if row["available"] is not None:
                          lines.append(f"  • {d_display}: <b>{row['available']}/{row['capacity']}</b>")
                      else:
                          lines.append(f"  • {d_display}: dato non disponibile")
                  if any(r["available"] == 0 for r in rows):
                      lines.append("")
                      lines.append("ℹ️ Uno 0 può significare lotto pieno, oppure che hai già "
                                   "una prenotazione attiva che blocca nuove date (vedi /future).")
                  send("\n".join(lines))

          elif command in ("/tokenstatus", "/token"):
              status = check_token_status()
              if status.valid:
                  lines = ["✅ <b>Token MFN valido</b>"]
              else:
                  lines = [f"⚠️ <b>Token MFN NON valido</b>\n{status.error}\n"
                           f"👉 <a href=\"https://gist.github.com/DanieleMCarletti/f72f1843f08c77a9bf8f96813e57a7dd\">Come rinnovare il token</a>"]
              if status.expires_at:
                  from datetime import datetime, timezone
                  try:
                      from zoneinfo import ZoneInfo
                      tz = ZoneInfo("Europe/Rome")
                  except Exception:
                      tz = timezone.utc
                  dt = datetime.fromtimestamp(status.expires_at, tz=timezone.utc).astimezone(tz)
                  days_left = (dt.date() - datetime.now(tz).date()).days
                  lines.append(f"🗓️ Scade il <b>{dt.strftime('%d/%m/%Y')}</b> alle {dt.strftime('%H:%M')} "
                               f"(tra {days_left} giorni)")
              else:
                  lines.append("ℹ️ Data di scadenza esatta non disponibile per questo token.")
              send("\n".join(lines))

          elif command in ("/help", "/start"):
              send(
                  "🅿️ <b>Parkbot — comandi disponibili:</b>\n\n"
                  "/park &lt;data&gt; — prenota, subito se possibile (es: /park giovedì)\n"
                  "/list — mostra prenotazioni in coda\n"
                  "/cancel &lt;data&gt; — rimuovi dalla coda\n"
                  "/future — prenotazioni confermate sul portale\n"
                  "/spots — posti liberi nei giorni della finestra prenotabile\n"
                  "/tokenstatus — verifica validità e scadenza del token MFN\n"
                  "/help — questo messaggio\n\n"
                  "Date accettate: oggi, domani, dopodomani, lunedì…domenica, gg/mm/aaaa"
              )

          else:
              send(f"❓ Comando non riconosciuto: {command}\nUsa /help per la lista.")
          EOF

      - name: Commit queue se modificata
        run: |
          git config user.name  "parkbot-actions"
          git config user.email "parkbot@users.noreply.github.com"
          git add queue/
          if git diff --cached --quiet; then
            echo "Nessuna modifica alla queue"
          else
            git commit -m "chore: queue update via bot [skip ci]"
            git push
          fi
