name: "Setup — configurazione iniziale parkbot"

# Eseguire UNA VOLTA dopo aver creato il repo dal template, DOPO aver già
# salvato i secrets CF_API_TOKEN e CF_ACCOUNT_ID (Settings -> Secrets and
# variables -> Actions). Salva tutti gli altri secrets, calcola l'URL del
# Cloudflare Worker dall'account (nessun copia-incolla manuale dell'URL),
# registra il webhook Telegram e verifica che tutto funzioni.
#
# Il Worker stesso (codice + suoi secrets GITHUB_PAT/ALLOWED_CHAT_ID) va
# pubblicato DOPO questo workflow, lanciando "Deploy Cloudflare Worker"
# (deploy-worker.yml) — vedi riepilogo finale.

on:
  workflow_dispatch:
    inputs:
      cognito_refresh_token:
        description: "Cognito refresh_token (dal browser DevTools sul portale MFN)"
        required: true
        type: string
      telegram_bot_token:
        description: "Token del bot Telegram (da BotFather, es. 123456:AABBcc...)"
        required: true
        type: string
      telegram_chat_id:
        description: "Telegram Chat ID (numero intero, es. 228967801)"
        required: true
        type: string
      setup_pat:
        description: "GitHub PAT con scope repo+workflow — PERMANENTE: lo userà anche il Worker, non cancellarlo dopo il setup"
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica prerequisiti (CF_API_TOKEN / CF_ACCOUNT_ID)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "✗ Mancano i secrets CF_API_TOKEN e/o CF_ACCOUNT_ID."
            echo "  Creali in Settings -> Secrets and variables -> Actions PRIMA di rilanciare questo workflow."
            echo "  Vedi README, sezione 'Riepilogo variabili e secrets'."
            exit 1
          fi
          echo "✓ CF_API_TOKEN e CF_ACCOUNT_ID presenti"

      - name: Maschera tutti i valori sensibili nei log
        env:
          T1: ${{ github.event.inputs.cognito_refresh_token }}
          T2: ${{ github.event.inputs.telegram_bot_token }}
          T3: ${{ github.event.inputs.setup_pat }}
        run: |
          echo "::add-mask::$T1"
          echo "::add-mask::$T2"
          echo "::add-mask::$T3"

      - name: Salva secrets su GitHub
        env:
          GH_TOKEN: ${{ github.event.inputs.setup_pat }}
          VAL_COGNITO:  ${{ github.event.inputs.cognito_refresh_token }}
          VAL_TG_TOKEN: ${{ github.event.inputs.telegram_bot_token }}
          VAL_TG_CHAT:  ${{ github.event.inputs.telegram_chat_id }}
          VAL_WORKER_PAT: ${{ github.event.inputs.setup_pat }}
        run: |
          echo "$VAL_COGNITO"    | gh secret set COGNITO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "$VAL_TG_TOKEN"   | gh secret set TELEGRAM_BOT_TOKEN    --repo "$GITHUB_REPOSITORY"
          echo "$VAL_TG_CHAT"    | gh secret set TELEGRAM_CHAT_ID      --repo "$GITHUB_REPOSITORY"
          echo "$VAL_WORKER_PAT" | gh secret set WORKER_GITHUB_PAT     --repo "$GITHUB_REPOSITORY"
          echo "✓ Secrets salvati (incluso WORKER_GITHUB_PAT, permanente, usato dal Worker)"

      - name: Calcola URL del Cloudflare Worker
        id: worker_url
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          RESP=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain")
          SUBDOMAIN=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('subdomain',''))" 2>/dev/null)
          if [ -z "$SUBDOMAIN" ]; then
            echo "✗ Impossibile leggere il sottodominio workers.dev dall'account Cloudflare."
            echo "  Risposta API: $RESP"
            echo "  Assicurati di aver attivato Workers sul tuo account (dash.cloudflare.com -> Workers & Pages, basta aprirla una volta per scegliere il sottodominio)."
            exit 1
          fi
          URL="https://parkbot-webhook.${SUBDOMAIN}.workers.dev"
          echo "✓ URL Worker: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Registra webhook Telegram
        env:
          BOT_TOKEN:  ${{ github.event.inputs.telegram_bot_token }}
          WORKER_URL: ${{ steps.worker_url.outputs.url }}
        run: |
          echo "Webhook URL: $WORKER_URL"
          RESP=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook?url=${WORKER_URL}")
          echo "Risposta Telegram: $RESP"
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if d.get('ok'):
              print('✓ Webhook registrato')
          else:
              print(f'✗ Webhook fallito: {d}')
              sys.exit(1)
          "

      - name: Verifica token MFN e raggiungibilità portale
        env:
          COGNITO_TOKEN: ${{ github.event.inputs.cognito_refresh_token }}
        run: |
          pip install httpx --quiet
          python3 - << 'PYEOF'
          import httpx, os, sys

          token = os.environ["COGNITO_TOKEN"]

          r = httpx.post(
              "https://parcheggi-milanofiori-nord.auth.eu-south-1.amazoncognito.com/oauth2/token",
              data={
                  "grant_type": "refresh_token",
                  "refresh_token": token,
                  "client_id": "3okj0mmk5fhbvs4afddf9002h8",
              },
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              timeout=15,
          )
          if r.status_code != 200:
              print(f"✗ Token Cognito non valido: HTTP {r.status_code}")
              sys.exit(1)

          access_token = r.json()["access_token"]

          r2 = httpx.get(
              "https://parcheggimilanofiorinord.it/app/api/prenotazioni/future",
              headers={"Authorization": f"Bearer {access_token}"},
              timeout=15,
          )
          if r2.status_code == 200:
              bookings = r2.json()
              print(f"✓ Token MFN valido — {len(bookings)} prenotazione/i trovata/e sul portale")
          else:
              print(f"✗ Portale non raggiungibile: HTTP {r2.status_code}")
              sys.exit(1)
          PYEOF

      - name: Riepilogo setup
        env:
          WORKER_URL: ${{ steps.worker_url.outputs.url }}
        run: |
          echo ""
          echo "================================================"
          echo "  ✅ Setup completato con successo!"
          echo "================================================"
          echo ""
          echo "Worker URL (già registrata su Telegram): $WORKER_URL"
          echo ""
          echo "Prossimo passo, UNICO rimasto:"
          echo ""
          echo "1. Vai su Actions -> 'Deploy Cloudflare Worker' -> Run workflow"
          echo "   (pubblica codice + secrets del Worker, nessun passaggio su Cloudflare dashboard)"
          echo "2. Manda /start al tuo bot Telegram per verificare"
          echo "3. Poi /help per vedere i comandi disponibili"
