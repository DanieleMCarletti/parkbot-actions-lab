name: "Probe — verifica accesso API MFN"

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa parkbot
        run: pip install -e .

      - name: Crea secrets/tokens.json dal secret GitHub
        run: |
          mkdir -p "$GITHUB_WORKSPACE/secrets"
          chmod 700 "$GITHUB_WORKSPACE/secrets"
          cat > "$GITHUB_WORKSPACE/secrets/tokens.json" << 'EOF'
          {"refresh_token": "${{ secrets.COGNITO_REFRESH_TOKEN }}", "saved_at": 0}
          EOF
          # Usa python per evitare problemi di quoting col token JWT
          python3 - << 'PYEOF'
          import json, os
          token = os.environ["COGNITO_REFRESH_TOKEN"]
          import time
          data = {"refresh_token": token, "saved_at": time.time()}
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "secrets", "tokens.json")
          with open(path, "w") as f:
              json.dump(data, f)
          os.chmod(path, 0o600)
          print("tokens.json scritto correttamente")
          PYEOF
        env:
          COGNITO_REFRESH_TOKEN: ${{ secrets.COGNITO_REFRESH_TOKEN }}

      - name: Verifica token Cognito (refresh)
        env:
          PARKBOT_STATE_DIR: ${{ github.workspace }}
        run: |
          echo "=== Test refresh token Cognito ==="
          python3 - << 'EOF'
          import os, sys
          os.environ.setdefault("PARKBOT_STATE_DIR", os.environ["GITHUB_WORKSPACE"])
          from parkbot import config
          print(f"STATE_DIR: {config.STATE_DIR}")
          print(f"TOKEN_FILE exists: {config.TOKEN_FILE.exists()}")
          try:
              from parkbot.tokens import get_access_token
              bundle = get_access_token()
              # Maschera il token nei log
              masked = bundle.access_token[:10] + "..." + bundle.access_token[-5:]
              print(f"✓ Access token ottenuto: {masked}")
              print(f"  expires_at: {bundle.expires_at}")
          except Exception as e:
              print(f"✗ Errore token: {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Lista prenotazioni future (read-only)
        env:
          PARKBOT_STATE_DIR: ${{ github.workspace }}
        run: |
          echo "=== parkbot future ==="
          parkbot future || true

      - name: Verifica disponibilità API (httpx diretto)
        env:
          PARKBOT_STATE_DIR: ${{ github.workspace }}
        run: |
          python3 - << 'EOF'
          import os, sys
          os.environ.setdefault("PARKBOT_STATE_DIR", os.environ["GITHUB_WORKSPACE"])
          from parkbot.tokens import get_access_token
          from parkbot import config
          import httpx

          bundle = get_access_token()
          headers = {"Authorization": bundle.authorization_header}

          # Controlla la finestra di prenotazione
          r = httpx.get(f"{config.PORTAL_API}/prenotazioni/disponibilita", headers=headers, timeout=15)
          print(f"GET /prenotazioni/disponibilita → HTTP {r.status_code}")
          if r.status_code == 200:
              import json
              data = r.json()
              print(f"  minDate: {data.get('minDate')}")
              print(f"  maxDate: {data.get('maxDate')}")
              print("✓ Portale MFN raggiungibile da GitHub Actions")
          else:
              print(f"  body: {r.text[:200]}")
              print("✗ Portale non raggiungibile o risposta inattesa")
              sys.exit(1)
          EOF

      - name: Ispeziona /parcheggi-disponibili (diagnostico — struttura mai documentata)
        env:
          PARKBOT_STATE_DIR: ${{ github.workspace }}
        run: |
          python3 - << 'EOF'
          import json, os
          os.environ.setdefault("PARKBOT_STATE_DIR", os.environ["GITHUB_WORKSPACE"])
          from parkbot.tokens import get_access_token
          from parkbot.booking import get_booking_window, check_availability

          bundle = get_access_token()
          window = get_booking_window(token=bundle)
          print(f"Finestra prenotabile: {window.min_date} .. {window.max_date}")

          data = check_availability(window.max_date, token=bundle)
          print(f"=== check_availability({window.max_date}) — struttura risposta ===")
          print(json.dumps(data, indent=2, ensure_ascii=False)[:3000])

          print("")
          print("=== Verifica se 'posti' è il catalogo fisso o i posti davvero liberi ===")
          from parkbot.booking import list_future_bookings
          existing = list_future_bookings(token=bundle)
          for b in existing:
              d = b.get("data") or b.get("date")
              spot = b.get("posti_codice")
              print(f"Prenotazione confermata: {d} -> posto {spot}")
              lots = check_availability(d, token=bundle)
              for lot in lots:
                  if lot.get("id") == 54:
                      print(f"  chiavi lotto: {sorted(lot.keys())}")
                      codes = [p.get("posti_codice") for p in (lot.get("posti") or [])]
                      print(f"  len(posti)={len(codes)}  n_posti={lot.get('n_posti')}  "
                            f"'{spot}' in posti? {spot in codes}")
                      if lot.get("posti"):
                          print(f"  chiavi di un elemento posti[0]: {sorted(lot['posti'][0].keys())}")
                      print(f"  postiDisponibili: {lot.get('postiDisponibili')}")

          print("")
          print("=== postiDisponibili su TUTTI i giorni della finestra ===")
          d = __import__('datetime').date.fromisoformat(window.min_date)
          end = __import__('datetime').date.fromisoformat(window.max_date)
          while d <= end:
              iso = d.isoformat()
              lots = check_availability(iso, token=bundle)
              for lot in lots:
                  if lot.get("id") == 54:
                      print(f"  {iso}: postiDisponibili={lot.get('postiDisponibili')}  "
                            f"n_posti={lot.get('n_posti')}  in not_available={iso in window.not_available}")
              d += __import__('datetime').timedelta(days=1)

          print("")
          print("=== BookingWindow.not_available (unico segnale di 'pieno' a livello data) ===")
          print(f"not_available: {window.not_available}")
          EOF

      - name: ⚠️ Tentativo REALE di prenotazione per oggi (bypassa il pre-check not_available)
        env:
          PARKBOT_STATE_DIR: ${{ github.workspace }}
        run: |
          python3 - << 'EOF'
          import os, datetime
          os.environ.setdefault("PARKBOT_STATE_DIR", os.environ["GITHUB_WORKSPACE"])
          from parkbot.tokens import get_access_token
          from parkbot.booking import book_parking

          today = datetime.date.today().isoformat()
          bundle = get_access_token()
          print(f"=== POST reale /prenotazioni per {today} (bypass pre-check) ===")
          result = book_parking(today, token=bundle)
          print(f"success={result.success}  status_code={result.status_code}  booking_id={result.booking_id}")
          print(f"body: {result.body[:500]}")
          EOF
